title: 绯野のblog
subtitle: 神の領域
description: 昴君的个人博客，记录技术、生活与思考。
keywords:
  - 二进制逆向
  - 编译原理
  - Linux
  - 原神
author: 昴君
language: zh-CN
timezone: Asia/Shanghai

# 创建 GitHub 仓库后，把 USERNAME 改成你的 GitHub 用户名。
url: https://r1c3sh0w3r.github.io
root: /
permalink: posts/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - live2d/**
  - assets/vendor/**
  - assets/video/**

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false

index_generator:
  path: ""
  per_page: 6
  order_by: -date

default_category: 未分类
category_map: {}
tag_map: {}
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime
per_page: 10
pagination_dir: page
include: []
exclude: []
ignore: []

theme: rem-dream

sitemap:
  path:
    - sitemap.xml
  rel: false
  tags: true
  categories: true

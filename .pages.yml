media:
  - name: post_images
    label: 文章图片
    input: source/uploads/images
    output: /uploads/images
    extensions: [jpg, jpeg, png, webp, gif]
    categories: [image]
    rename: safe
  - name: post_videos
    label: 文章视频
    input: source/uploads/videos
    output: /uploads/videos
    extensions: [mp4, webm]
    categories: [video]
    rename: safe

content:
  - name: posts
    label: 博客文章
    type: collection
    path: source/_posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: create
    view:
      fields: [title, categories, date]
      primary: title
      sort: [date, title, categories]
      search: [title, description, categories, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 文章标题
        type: string
        required: true
      - name: date
        label: 发布时间
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd HH:mm:ss
      - name: description
        label: 文章摘要
        type: text
        description: 显示在首页文章列表中，建议填写一到两句话。
      - name: categories
        label: 文章分类
        type: select
        required: true
        options:
          placeholder: 请选择一个分类
          values:
            - 技术
            - 生活
            - 自创文
      - name: tags
        label: 文章标签
        type: string
        list: true
        description: 可按需要添加多个标签，例如 Hexo、随笔、小说。
      - name: cover
        label: 文章封面图
        type: image
        options:
          media: post_images
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe
      - name: video
        label: 文章视频
        type: file
        description: 建议只上传较短的视频；较大的视频请使用哔哩哔哩等平台的嵌入代码。
        options:
          media: post_videos
          extensions: [mp4, webm]
          categories: [video]
          rename: safe
      - name: video_poster
        label: 视频封面图
        type: image
        options:
          media: post_images
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: content_blocks
        label: 图文正文（可自由排序）
        type: block
        list: true
        blockKey: type
        description: 按文章顺序添加文字、图片、视频或外部视频，可以拖动调整位置。
        blocks:
          - name: text
            label: 文字段落
            fields:
              - name: content
                label: 文字内容
                type: rich-text
                required: true
                options:
                  format: markdown
                  media: post_images
                  extensions: [jpg, jpeg, png, webp, gif]
                  rename: safe
                  switcher: true
          - name: image
            label: 图片
            fields:
              - name: src
                label: 上传或选择图片
                type: image
                required: true
                options:
                  media: post_images
                  extensions: [jpg, jpeg, png, webp, gif]
                  rename: safe
              - name: alt
                label: 图片说明
                type: string
              - name: caption
                label: 图片下方文字
                type: string
          - name: video
            label: 上传视频
            fields:
              - name: src
                label: 上传或选择视频
                type: file
                required: true
                options:
                  media: post_videos
                  extensions: [mp4, webm]
                  categories: [video]
                  rename: safe
              - name: poster
                label: 视频封面图
                type: image
                options:
                  media: post_images
                  extensions: [jpg, jpeg, png, webp]
                  rename: safe
              - name: caption
                label: 视频下方文字
                type: string
          - name: embed
            label: 外部视频（B站或 YouTube）
            fields:
              - name: url
                label: 播放器嵌入地址
                type: string
                required: true
                description: 填写以 https:// 或 // 开头的播放器地址，不要填写普通视频页面地址。
                pattern:
                  regex: "^(https?:)?//.+$"
                  message: 请输入以 https:// 或 // 开头的播放器嵌入地址。
              - name: title
                label: 视频标题
                type: string
              - name: caption
                label: 视频下方文字
                type: string
      - name: body
        label: 旧版 Markdown 正文
        type: rich-text
        description: 旧文章内容会保留在这里；新文章请优先使用上方「图文正文」自由穿插媒体。
        options:
          format: markdown
          media: post_images
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe
          switcher: true

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "发布文章：{filename}"
      update: "更新文章：{filename}"
      delete: "删除文章：{filename}"
      rename: "重命名文章：{oldFilename} -> {newFilename}"
